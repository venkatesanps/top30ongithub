name: CI

# Checks every human push and pull request: catalog is valid, generated files match it,
# scripts parse, zips are well-formed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog, pins and zips
        run: python3 scripts/kit.py validate

      - name: Generated files match catalog.json
        run: |
          python3 scripts/kit.py render
          if ! git diff --exit-code -- install.sh verify.sh guide/index.html README.md THIRD_PARTY_NOTICES.md; then
            echo "::error::Generated files are stale. Run: python3 scripts/kit.py render, then commit."
            exit 1
          fi

      - name: Scripts parse and run
        run: |
          bash -n install.sh && bash -n verify.sh
          shellcheck -S error install.sh verify.sh
          ./install.sh --list > /dev/null
          ./install.sh --status > /dev/null
          ./install.sh --dry-run row 1 row 5 > /dev/null
          python3 -m py_compile scripts/kit.py

      - name: Workflow templates
        run: |
          cmp examples/sql-review-agent/checks.py templates/claude-code-action/sql_checks.py
          pip install --quiet actionlint-py
          mkdir -p /tmp/al/.github/workflows && cp templates/claude-code-action/*.yml /tmp/al/.github/workflows/
          cd /tmp/al && git init -q && actionlint

      - name: Skill and example tests
        run: |
          pip install --quiet sqlglot claude-agent-sdk anthropic
          python3 tests/sql_agent/test_sql_agent.py
          python3 tests/caching/test_cache_demo.py
          python3 tests/datadog/test_dd_collect.py
          python3 tests/ab/test_ab.py
          python3 -m py_compile scripts/ab.py
