name: Refresh

# Daily: re-check all 30 upstream repos, re-pin what changed, rebuild zips, re-test installs,
# refresh the guide, commit the results, and keep one "upstream-attention" issue current.
on:
  schedule:
    - cron: "17 11 * * *"   # 06:17 Central (daylight time) / 05:17 standard time
  workflow_dispatch:
    inputs:
      test_all:
        description: "Install-test all 30 (default: only changed items, and all on Mondays)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      # Only OpenMontage and HyperFrames need FFmpeg; apt on the runner can hang, so use a static build.
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5
        continue-on-error: true

      - name: Install Claude Code CLI
        timeout-minutes: 8
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code </dev/null
          timeout 60 claude --version </dev/null

      - name: Decide test scope
        id: scope
        run: |
          if [ "${{ inputs.test_all }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "which=--all" >> "$GITHUB_OUTPUT"
          else
            echo "which=--changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Check upstream repos
        timeout-minutes: 15
        run: python3 scripts/kit.py check --all

      - name: Re-pin changed repos
        timeout-minutes: 10
        run: python3 scripts/kit.py bump --changed

      - name: Rebuild skill zips
        timeout-minutes: 25
        run: python3 scripts/kit.py pack ${{ steps.scope.outputs.which }}

      - name: Measure token cost per session
        timeout-minutes: 30
        run: python3 scripts/kit.py costs ${{ steps.scope.outputs.which }}

      - name: Install tests
        timeout-minutes: 120
        run: python3 scripts/kit.py smoke ${{ steps.scope.outputs.which }}

      - name: Render and report
        timeout-minutes: 5
        run: |
          python3 scripts/kit.py render
          python3 scripts/kit.py report
          python3 scripts/kit.py validate

      - name: Commit changes
        run: |
          git config user.name "top30 refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!sources' ':!build'
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -q -F build/commit-msg.txt
            git push
          fi

      - name: Update attention issue
        if: always()
        run: |
          [ -f build/attention-count ] || exit 0
          n=$(cat build/attention-count)
          gh label create upstream-attention --color d93f0b --description "Found by the daily refresh" 2>/dev/null || true
          num=$(gh issue list --label upstream-attention --state open --json number -q '.[0].number')
          if [ "$n" -gt 0 ]; then
            title="$n plugin(s) need attention"
            if [ -n "$num" ]; then
              gh issue edit "$num" --title "$title" --body-file build/issue.md
              [ -s build/new-problems.md ] && gh issue comment "$num" --body-file build/new-problems.md
            else
              gh issue create --title "$title" --label upstream-attention --body-file build/issue.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Everything passed in the $(date -u +%F) refresh."
          fi

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs
          path: build/
          retention-days: 14

      - name: Package guide for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide

  pages:
    # Needs Settings → Pages → Source: "GitHub Actions" turned on once; until then this job is skipped over.
    needs: refresh
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
