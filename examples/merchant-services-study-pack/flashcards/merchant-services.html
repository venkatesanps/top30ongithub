<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant services basics</title><style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--good:#059669;--bad:#dc2626;--cz:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#22304d;--accent:#60a5fa;--good:#34d399;--bad:#f87171;--cz:#3b2f0b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.cz{background:var(--cz);padding:0 4px;border-radius:4px}b.cz{font-weight:700}

main{max-width:720px;margin:0 auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.boxes{display:flex;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}.boxes span{border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.card{perspective:1200px;height:300px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.face.b{transform:rotateY(180deg)}.face .txt{font-size:21px;font-weight:600}.face.b .txt{font-weight:500;font-size:19px}.meta{position:absolute;bottom:12px;left:16px;right:16px;font-size:12px;color:var(--muted)}
.lbl{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grade{display:flex;gap:10px;justify-content:center;margin-top:16px}.grade button{min-width:130px}.grade .no{border-color:var(--bad);color:var(--bad)}.grade .yes{border-color:var(--good);color:var(--good)}
.done{text-align:center;padding:48px 0;color:var(--muted)}kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.help{color:var(--muted);font-size:13px;text-align:center;margin-top:12px}
@media (max-width:520px){.card{height:340px}.grade button{min-width:0;flex:1}}
</style></head><body><main>
<h1>Merchant services basics</h1><p class="sub">30 cards on how card acquiring works: parties, authorization, settlement, funding, fees, chargebacks and reports. Unofficial study aid built from public sources.</p>
<div class="bar"><select id="tag" aria-label="Topic"><option value="">All topics</option></select><button id="shuffle">Shuffle</button><button id="reset">Reset progress</button>
<div class="boxes" id="boxes" title="Leitner boxes: a card moves up a box when you know it and back to box 1 when you don't"></div></div>
<div id="stage"></div>
<p class="help">Click the card or press <kbd>Space</kbd> to flip. <kbd>1</kbd> = again, <kbd>2</kbd> = got it.</p>
</main><script>
const CARDS=[{"id": 0, "q": "What does an acquirer (merchant processor) do for a merchant?", "a": "Authorizes card payments, settles them through the networks, funds the merchant, and carries the chargeback liability.", "tags": ["parties"], "src": "merchant-services-guide: parties"}, {"id": 1, "q": "Who is the issuer in a card payment?", "a": "The cardholder&#x27;s bank. It approves or declines the auth and starts disputes.", "tags": ["parties"], "src": "merchant-services-guide: parties"}, {"id": 2, "q": "What do card networks (Visa, Mastercard, Discover) do?", "a": "Route and clear transactions between acquirers and issuers, set interchange and write the rules.", "tags": ["parties"], "src": "merchant-services-guide: parties"}, {"id": 3, "q": "Money for a sale flows <span class=\"cz\">[...]<\/span> -&gt; network -&gt; <span class=\"cz\">[...]<\/span> -&gt; merchant; fees flow the other way.", "a": "Money for a sale flows <b class=\"cz\">issuer<\/b> -&gt; network -&gt; <b class=\"cz\">acquirer<\/b> -&gt; merchant; fees flow the other way.", "tags": ["parties", "money-flow"], "src": "merchant-services-guide: money flows"}, {"id": 4, "q": "Does money move during authorization?", "a": "No. The issuer only places a hold on the cardholder&#x27;s available credit.", "tags": ["authorization"], "src": "merchant-services-guide: authorization"}, {"id": 5, "q": "How does the acquirer&#x27;s switch pick a card network for an auth?", "a": "By the card&#x27;s BIN range and method of payment.", "tags": ["authorization"], "src": "merchant-services-guide: authorization"}, {"id": 6, "q": "Which merchants rely on incremental authorizations?", "a": "Hotels and car rentals, where the final amount grows after the first auth.", "tags": ["authorization"], "src": "merchant-services-guide: authorization variants"}, {"id": 7, "q": "What is a $0 verification?", "a": "An authorization for zero dollars that checks the card is valid without holding funds.", "tags": ["authorization"], "src": "merchant-services-guide: authorization variants"}, {"id": 8, "q": "Why reverse an authorization you won&#x27;t capture?", "a": "It releases the cardholder&#x27;s hold and avoids network fees for unused auths, such as Mastercard&#x27;s processing integrity fee.", "tags": ["authorization", "fees"], "src": "merchant-services-guide: fees"}, {"id": 9, "q": "Mastercard charges a processing integrity fee if an unused auth isn&#x27;t reversed within <span class=\"cz\">[...]<\/span> for card-present or <span class=\"cz\">[...]<\/span> for card-not-present.", "a": "Mastercard charges a processing integrity fee if an unused auth isn&#x27;t reversed within <b class=\"cz\">24 hours<\/b> for card-present or <b class=\"cz\">72 hours<\/b> for card-not-present.", "tags": ["authorization", "fees"], "src": "merchant-services-guide: fees"}, {"id": 10, "q": "What is capture?", "a": "The merchant confirming it will collect a previously authorized amount, usually when the order ships.", "tags": ["settlement"], "src": "merchant-services-guide: settlement"}, {"id": 11, "q": "What happens at batch close?", "a": "The day&#x27;s captured transactions are submitted to the acquirer for settlement.", "tags": ["settlement"], "src": "merchant-services-guide: settlement"}, {"id": 12, "q": "What is interchange qualification?", "a": "Matching each deposit to its auth and data to decide which interchange rate applies.", "tags": ["settlement", "fees"], "src": "merchant-services-guide: settlement"}, {"id": 13, "q": "What causes an interchange downgrade?", "a": "Missing or stale data, like a late capture or missing address, which earns a higher rate.", "tags": ["settlement", "fees"], "src": "merchant-services-guide: settlement"}, {"id": 14, "q": "What is a reject in settlement?", "a": "A transaction that fails the acquirer&#x27;s edits and must be fixed and resubmitted.", "tags": ["settlement"], "src": "merchant-services-guide: settlement"}, {"id": 15, "q": "Funded amount = sales - <span class=\"cz\">[...]<\/span> - <span class=\"cz\">[...]<\/span> +/- adjustments - fees (if netted) +/- <span class=\"cz\">[...]<\/span> moves.", "a": "Funded amount = sales - <b class=\"cz\">refunds<\/b> - <b class=\"cz\">chargebacks<\/b> +/- adjustments - fees (if netted) +/- <b class=\"cz\">reserve<\/b> moves.", "tags": ["funding"], "src": "merchant-services-guide: funding"}, {"id": 16, "q": "What funding schedules can a merchant have?", "a": "Daily, weekly, monthly or manual release.", "tags": ["funding"], "src": "merchant-services-guide: funding"}, {"id": 17, "q": "Which payment rails are used to fund merchants?", "a": "ACH, same-day ACH, wire, or a book transfer when the account is at the same bank.", "tags": ["funding"], "src": "merchant-services-guide: funding"}, {"id": 18, "q": "What does it mean that Amex is a conveyed brand?", "a": "The acquirer passes the transaction along and Amex funds the merchant directly.", "tags": ["funding", "parties"], "src": "merchant-services-guide: funding"}, {"id": 19, "q": "Who receives interchange?", "a": "The issuer.", "tags": ["fees"], "src": "merchant-services-guide: fees"}, {"id": 20, "q": "Who receives assessments?", "a": "The card brand (network), as a percentage of volume.", "tags": ["fees"], "src": "merchant-services-guide: fees"}, {"id": 21, "q": "Name the common merchant pricing plans.", "a": "Interchange-plus, tiered, flat rate, and swiped/keyed.", "tags": ["fees", "pricing"], "src": "merchant-services-guide: pricing"}, {"id": 22, "q": "How does interchange-plus pricing work?", "a": "The merchant pays actual interchange and assessments, plus a fixed acquirer markup.", "tags": ["fees", "pricing"], "src": "merchant-services-guide: pricing"}, {"id": 23, "q": "When do card brands usually update interchange rates?", "a": "Twice a year, in April and October.", "tags": ["fees"], "src": "merchant-services-guide: fees"}, {"id": 24, "q": "How is the effective merchant discount rate (EMDR) calculated?", "a": "Total processing cost divided by sales volume.", "tags": ["fees"], "src": "merchant-services-guide: fees"}, {"id": 25, "q": "What is a retrieval request?", "a": "The issuer asking for transaction proof before a dispute. No money moves.", "tags": ["chargebacks"], "src": "merchant-services-guide: chargebacks"}, {"id": 26, "q": "What happens to the merchant&#x27;s money on a first chargeback?", "a": "The disputed amount is debited from the merchant.", "tags": ["chargebacks"], "src": "merchant-services-guide: chargebacks"}, {"id": 27, "q": "What is representment?", "a": "The merchant fighting a chargeback by sending evidence back through the acquirer.", "tags": ["chargebacks"], "src": "merchant-services-guide: chargebacks"}, {"id": 28, "q": "Dispute stages: retrieval -&gt; first chargeback -&gt; <span class=\"cz\">[...]<\/span> -&gt; <span class=\"cz\">[...]<\/span> -&gt; arbitration.", "a": "Dispute stages: retrieval -&gt; first chargeback -&gt; <b class=\"cz\">representment<\/b> -&gt; <b class=\"cz\">pre-arbitration<\/b> -&gt; arbitration.<p>Arbitration is decided by the card network.<\/p>", "tags": ["chargebacks"], "src": "merchant-services-guide: chargebacks"}, {"id": 29, "q": "On a merchant&#x27;s reports, which key joins one sale across auth, deposit, funding and chargeback records?", "a": "The transaction reference. For online orders, the order number and gateway reference.", "tags": ["reporting"], "src": "merchant-services-guide: data model"}];const KEY="flashcards:merchant-services-basics";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const box=id=>(st[id]||1);let queue=[],cur=null,flipped=false;
const tags=[...new Set(CARDS.flatMap(c=>c.tags))].sort();const sel=document.getElementById("tag");
tags.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;sel.appendChild(o)});
function build(shuffle){const t=sel.value;let cs=CARDS.filter(c=>!t||c.tags.includes(t));
cs.sort((a,b)=>box(a.id)-box(b.id)||a.id-b.id);if(shuffle){for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}cs.sort((a,b)=>box(a.id)-box(b.id))}
queue=cs.filter(c=>box(c.id)<5);next()}
function boxes(){const n=[0,0,0,0,0];CARDS.forEach(c=>n[box(c.id)-1]++);document.getElementById("boxes").innerHTML=n.map((v,i)=>`<span>Box ${i+1}: ${v}</span>`).join("")}
function next(){boxes();cur=queue.shift();flipped=false;const s=document.getElementById("stage");
if(!cur){s.innerHTML='<div class="done">Nothing left in this set. Every card is in box 5. Reset progress to go again.</div>';return}
s.innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, press space to flip"><div class="inner">
<div class="face"><span class="lbl">Question - box ${box(cur.id)}</span><div class="txt">${cur.q}</div><div class="meta">${cur.tags.join(" · ")}</div></div>
<div class="face b"><span class="lbl">Answer</span><div class="txt">${cur.a}</div><div class="meta">${cur.src}</div></div></div></div>
<div class="grade"><button class="no" id="no">Again (1)</button><button class="yes" id="yes">Got it (2)</button></div>`;
document.getElementById("card").onclick=flip;document.getElementById("no").onclick=()=>grade(false);document.getElementById("yes").onclick=()=>grade(true)}
function flip(){flipped=!flipped;document.getElementById("card").classList.toggle("flip",flipped)}
function grade(ok){if(!cur)return;st[cur.id]=ok?Math.min(5,box(cur.id)+1):1;save();if(!ok)queue.splice(Math.min(3,queue.length),0,cur);next()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.code==="Space"){e.preventDefault();flip()}if(e.key==="1")grade(false);if(e.key==="2")grade(true)});
sel.onchange=()=>build(false);document.getElementById("shuffle").onclick=()=>build(true);
document.getElementById("reset").onclick=()=>{st={};save();build(false)};build(false);
</script></body></html>
