<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snowflake DE architecture</title><style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--good:#059669;--bad:#dc2626;--cz:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#22304d;--accent:#60a5fa;--good:#34d399;--bad:#f87171;--cz:#3b2f0b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.cz{background:var(--cz);padding:0 4px;border-radius:4px}b.cz{font-weight:700}

main{max-width:720px;margin:0 auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.boxes{display:flex;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}.boxes span{border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.card{perspective:1200px;height:300px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.face.b{transform:rotateY(180deg)}.face .txt{font-size:21px;font-weight:600}.face.b .txt{font-weight:500;font-size:19px}.meta{position:absolute;bottom:12px;left:16px;right:16px;font-size:12px;color:var(--muted)}
.lbl{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grade{display:flex;gap:10px;justify-content:center;margin-top:16px}.grade button{min-width:130px}.grade .no{border-color:var(--bad);color:var(--bad)}.grade .yes{border-color:var(--good);color:var(--good)}
.done{text-align:center;padding:48px 0;color:var(--muted)}kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.help{color:var(--muted);font-size:13px;text-align:center;margin-top:12px}
@media (max-width:520px){.card{height:340px}.grade button{min-width:0;flex:1}}
</style></head><body><main>
<h1>Snowflake DE architecture</h1><p class="sub">The three layers, ingestion, storage, transformation, caches, protection, governance and sharing; Gen1 credit figures. Checked November 2026.</p>
<div class="bar"><select id="tag" aria-label="Topic"><option value="">All topics</option></select><button id="shuffle">Shuffle</button><button id="reset">Reset progress</button>
<div class="boxes" id="boxes" title="Leitner boxes: a card moves up a box when you know it and back to box 1 when you don't"></div></div>
<div id="stage"></div>
<p class="help">Click the card or press <kbd>Space</kbd> to flip. <kbd>1</kbd> = again, <kbd>2</kbd> = got it.</p>
</main><script>
const CARDS=[{"id": 0, "q": "Snowflake&#x27;s three layers: <span class=\"cz\">[...]<\/span>, <span class=\"cz\">[...]<\/span> and storage.", "a": "Snowflake&#x27;s three layers: <b class=\"cz\">cloud services<\/b>, <b class=\"cz\">compute (warehouses)<\/b> and storage.", "tags": ["layers"], "src": "README.md, 1"}, {"id": 1, "q": "Which layer holds the result cache and the query optimizer?", "a": "Cloud services", "tags": ["layers", "cache"], "src": "README.md, 1"}, {"id": 2, "q": "When are cloud-services credits actually billed?", "a": "Only the part above 10% of that day&#x27;s warehouse credits", "tags": ["layers", "cost"], "src": "README.md, 1"}, {"id": 3, "q": "How is a warehouse billed when it resumes?", "a": "Per second, with a 60-second minimum each time it starts", "tags": ["compute", "cost"], "src": "README.md, 1"}, {"id": 4, "q": "Gen1 credits per hour for X-Small, Small, Medium, Large, X-Large?", "a": "1, 2, 4, 8, 16: each size doubles", "tags": ["compute", "cost"], "src": "README.md, 1"}, {"id": 5, "q": "Gen2 X-Small credits per hour on AWS?", "a": "1.35 (Azure: 1.25)", "tags": ["compute", "cost", "gen2"], "src": "README.md, 1"}, {"id": 6, "q": "How do you keep a new warehouse on Gen1 where Gen2 is the default?", "a": "Create it with RESOURCE_CONSTRAINT = STANDARD_GEN_1", "tags": ["compute", "gen2"], "src": "README.md, 1"}, {"id": 7, "q": "Which column of SHOW WAREHOUSES tells Gen1 from Gen2?", "a": "resource_constraint", "tags": ["compute", "gen2"], "src": "README.md, 1"}, {"id": 8, "q": "A Medium finishes in 1 minute; an X-Small takes 4. Which costs more?", "a": "Neither: 4 credits/h \u00d7 1 min equals 1 credit/h \u00d7 4 min", "tags": ["compute", "cost"], "src": "README.md, 1"}, {"id": 9, "q": "Many users queue on one warehouse. Scale up or out?", "a": "Out: a multi-cluster warehouse (Enterprise)", "tags": ["compute", "performance"], "src": "README.md, 2"}, {"id": 10, "q": "How long does Snowflake keep load metadata that stops COPY INTO reloading a file?", "a": "64 days", "tags": ["ingestion"], "src": "README.md, 2"}, {"id": 11, "q": "What does FORCE = TRUE on COPY INTO risk?", "a": "Loading files again, so duplicate rows", "tags": ["ingestion"], "src": "README.md, 2"}, {"id": 12, "q": "What does CREATE OR REPLACE TABLE do to COPY load metadata?", "a": "Wipes it, so the next COPY reloads every file still in the stage", "tags": ["ingestion"], "src": "README.md, 2"}, {"id": 13, "q": "How is Snowpipe billed since December 2025?", "a": "0.0037 credits per GB ingested, no per-file charge", "tags": ["ingestion", "cost"], "src": "README.md, 2"}, {"id": 14, "q": "Snowpipe bills a gzipped CSV at which size?", "a": "Its uncompressed size", "tags": ["ingestion", "cost"], "src": "README.md, 2"}, {"id": 15, "q": "Snowpipe auto-ingest on AWS: S3 event \u2192 <span class=\"cz\">[...]<\/span> \u2192 Snowpipe.", "a": "Snowpipe auto-ingest on AWS: S3 event \u2192 <b class=\"cz\">SQS<\/b> \u2192 Snowpipe.", "tags": ["ingestion"], "src": "README.md, 2"}, {"id": 16, "q": "Which object holds IAM trust to a bucket so nobody puts keys in a stage?", "a": "A storage integration", "tags": ["ingestion", "security"], "src": "README.md, 2"}, {"id": 17, "q": "Which table type stores data as Apache Iceberg in your own bucket?", "a": "Iceberg tables", "tags": ["ingestion", "storage"], "src": "README.md, 2"}, {"id": 18, "q": "Micro-partition size, and measured how?", "a": "50\u2013500 MB, before compression", "tags": ["storage"], "src": "README.md, 3"}, {"id": 19, "q": "Why does an UPDATE create Time Travel history?", "a": "Micro-partitions are immutable, so new ones are written", "tags": ["storage", "protection"], "src": "README.md, 3"}, {"id": 20, "q": "What lets Snowflake skip micro-partitions during a query?", "a": "Pruning on per-column min/max metadata", "tags": ["storage", "performance"], "src": "README.md, 3"}, {"id": 21, "q": "Does SELECT from a stream advance its offset?", "a": "No; only DML that consumes the stream does", "tags": ["transformation"], "src": "README.md, 4"}, {"id": 22, "q": "How does a task skip runs when there&#x27;s no new data?", "a": "WHEN SYSTEM$STREAM_HAS_DATA(&#x27;&lt;stream&gt;&#x27;)", "tags": ["transformation", "cost"], "src": "README.md, 4"}, {"id": 23, "q": "What does TARGET_LAG = &#x27;10 minutes&#x27; mean?", "a": "Data at most ~10 minutes stale (a target), not a refresh every 10 minutes", "tags": ["transformation"], "src": "README.md, 4"}, {"id": 24, "q": "What TARGET_LAG should intermediate dynamic tables use?", "a": "DOWNSTREAM", "tags": ["transformation"], "src": "README.md, 4"}, {"id": 25, "q": "Result cache lifetime?", "a": "24 hours, renewed on reuse up to 31 days from the first run", "tags": ["cache"], "src": "README.md, 5"}, {"id": 26, "q": "Name two things that stop result cache reuse.", "a": "Changed underlying data; a different query text or a function like CURRENT_TIMESTAMP()", "tags": ["cache"], "src": "README.md, 5"}, {"id": 27, "q": "What happens to the warehouse cache on suspend?", "a": "It is dropped", "tags": ["cache", "compute"], "src": "README.md, 5"}, {"id": 28, "q": "Which session parameter turns result reuse off for benchmarking?", "a": "USE_CACHED_RESULT = FALSE", "tags": ["cache"], "src": "README.md, 5"}, {"id": 29, "q": "Which feature speeds point lookups on high-cardinality columns?", "a": "Search optimization (Enterprise)", "tags": ["performance"], "src": "README.md, 5"}, {"id": 30, "q": "Can a materialized view join two tables?", "a": "No, one base table only (Enterprise)", "tags": ["performance"], "src": "README.md, 5"}, {"id": 31, "q": "What caps Query Acceleration Service spend?", "a": "QUERY_ACCELERATION_MAX_SCALE_FACTOR", "tags": ["performance", "cost"], "src": "README.md, 5"}, {"id": 32, "q": "Maximum Time Travel on Standard Edition?", "a": "1 day", "tags": ["protection", "editions"], "src": "README.md, 6"}, {"id": 33, "q": "Maximum Time Travel on Enterprise for permanent tables?", "a": "90 days", "tags": ["protection", "editions"], "src": "README.md, 6"}, {"id": 34, "q": "Fail-safe period, and for which tables?", "a": "7 days, permanent tables only", "tags": ["protection"], "src": "README.md, 6"}, {"id": 35, "q": "Who can recover data from Fail-safe?", "a": "Only Snowflake Support", "tags": ["protection"], "src": "README.md, 6"}, {"id": 36, "q": "Why make ETL work tables transient?", "a": "No Fail-safe storage for data you can rebuild", "tags": ["protection", "cost"], "src": "README.md, 6"}, {"id": 37, "q": "Restore a table to just before a bad DELETE.", "a": "CLONE ... BEFORE(STATEMENT =&gt; &#x27;&lt;query id&gt;&#x27;), then swap", "tags": ["protection"], "src": "README.md, 6"}, {"id": 38, "q": "Does cloning a single table copy its grants?", "a": "No, unless you add COPY GRANTS", "tags": ["protection", "security"], "src": "README.md, 6"}, {"id": 39, "q": "Which pipes are skipped when a database is cloned?", "a": "Pipes that read from internal stages", "tags": ["protection"], "src": "README.md, 6"}, {"id": 40, "q": "Who pays for compute used in a reader account?", "a": "The provider", "tags": ["sharing", "cost"], "src": "README.md, 8"}, {"id": 41, "q": "In a direct share, who pays for the queries?", "a": "The consumer, on its own warehouses", "tags": ["sharing", "cost"], "src": "README.md, 8"}, {"id": 42, "q": "Why share secure views rather than plain views?", "a": "Consumers can&#x27;t see a secure view&#x27;s definition", "tags": ["sharing", "security"], "src": "README.md, 8"}, {"id": 43, "q": "Name four Enterprise-only governance policies.", "a": "Masking, row access, aggregation, projection", "tags": ["security", "editions"], "src": "README.md, 7"}, {"id": 44, "q": "Which system role should create everyday objects?", "a": "SYSADMIN (or custom roles granted to it)", "tags": ["security"], "src": "README.md, 7"}];const KEY="flashcards:snowflake-de-architecture";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const box=id=>(st[id]||1);let queue=[],cur=null,flipped=false;
const tags=[...new Set(CARDS.flatMap(c=>c.tags))].sort();const sel=document.getElementById("tag");
tags.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;sel.appendChild(o)});
function build(shuffle){const t=sel.value;let cs=CARDS.filter(c=>!t||c.tags.includes(t));
cs.sort((a,b)=>box(a.id)-box(b.id)||a.id-b.id);if(shuffle){for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}cs.sort((a,b)=>box(a.id)-box(b.id))}
queue=cs.filter(c=>box(c.id)<5);next()}
function boxes(){const n=[0,0,0,0,0];CARDS.forEach(c=>n[box(c.id)-1]++);document.getElementById("boxes").innerHTML=n.map((v,i)=>`<span>Box ${i+1}: ${v}</span>`).join("")}
function next(){boxes();cur=queue.shift();flipped=false;const s=document.getElementById("stage");
if(!cur){s.innerHTML='<div class="done">Nothing left in this set. Every card is in box 5. Reset progress to go again.</div>';return}
s.innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, press space to flip"><div class="inner">
<div class="face"><span class="lbl">Question - box ${box(cur.id)}</span><div class="txt">${cur.q}</div><div class="meta">${cur.tags.join(" · ")}</div></div>
<div class="face b"><span class="lbl">Answer</span><div class="txt">${cur.a}</div><div class="meta">${cur.src}</div></div></div></div>
<div class="grade"><button class="no" id="no">Again (1)</button><button class="yes" id="yes">Got it (2)</button></div>`;
document.getElementById("card").onclick=flip;document.getElementById("no").onclick=()=>grade(false);document.getElementById("yes").onclick=()=>grade(true)}
function flip(){flipped=!flipped;document.getElementById("card").classList.toggle("flip",flipped)}
function grade(ok){if(!cur)return;st[cur.id]=ok?Math.min(5,box(cur.id)+1):1;save();if(!ok)queue.splice(Math.min(3,queue.length),0,cur);next()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.code==="Space"){e.preventDefault();flip()}if(e.key==="1")grade(false);if(e.key==="2")grade(true)});
sel.onchange=()=>build(false);document.getElementById("shuffle").onclick=()=>build(true);
document.getElementById("reset").onclick=()=>{st={};save();build(false)};build(false);
</script></body></html>
