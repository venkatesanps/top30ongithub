<rect x="487" y="398" width="433" height="60" rx="8" fill="#fbe9e8" stroke="#cc3f3f" stroke-width="1.5"/>
<text x="499" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#5d626b">CREATE OR REPLACE TABLE</text>
