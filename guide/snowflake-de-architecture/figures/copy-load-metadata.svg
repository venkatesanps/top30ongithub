<text x="520" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#5d626b" text-anchor="middle" stroke="#fbfbf9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">loads 3</text>
