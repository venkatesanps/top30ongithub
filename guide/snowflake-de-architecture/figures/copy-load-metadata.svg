<text x="40" y="74" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#22252a" font-weight="700">Re-running COPY INTO loads nothing new</text>
<text x="40" y="100" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#5d626b" font-style="italic">The table keeps 64 days of load metadata, so files it has already loaded are skipped.</text>
