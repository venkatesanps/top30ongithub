<text x="635" y="198.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5d626b" text-anchor="middle">3 files loaded</text>
<rect x="790" y="150" width="130" height="64" rx="8" fill="#e2f4f1" stroke="#16897c" stroke-width="1.5"/>
